<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="qdf-hook">
  <title>qdf-hook</title>
  <desc>A few bold warm strokes collapse into a bright cyan neck and fan out as ordered cyan strokes — verbose input compressed into terse output. Q and H flank the transition.</desc>

  <defs>
    <radialGradient id="bg" cx="46%" cy="44%" r="64%">
      <stop offset="0%"  stop-color="#1e2b50"/>
      <stop offset="72%" stop-color="#152039"/>
      <stop offset="100%" stop-color="#0e1730"/>
    </radialGradient>
    <linearGradient id="warm" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"  stop-color="#ff9e4f"/>
      <stop offset="50%" stop-color="#e85d9e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6ff0ff"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f2f5fb"/>
      <stop offset="55%" stop-color="#cdd4e2"/>
      <stop offset="100%" stop-color="#a3acc0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#eaffff"/>
      <stop offset="40%" stop-color="#7ff3ff"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="248"/></clipPath>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>

  <g clip-path="url(#disc)" fill="none" stroke-linecap="round">
    <!-- LEFT: few bold warm strokes converging to the neck (258,256) -->
    <g stroke="url(#warm)" stroke-width="11">
      <path d="M258 256 C 170 250, 130 150, 96 120"/>
      <path d="M258 256 C 175 252, 120 190, 78 188"/>
      <path d="M258 256 C 170 256, 110 256, 66 256"/>
      <path d="M258 256 C 175 260, 120 322, 78 324"/>
      <path d="M258 256 C 170 262, 130 362, 96 392"/>
    </g>
    <!-- RIGHT: few bold ordered cyan strokes fanning out -->
    <g stroke="url(#cool)" stroke-width="11">
      <path d="M258 256 C 330 256, 372 150, 430 128"/>
      <path d="M258 256 C 330 256, 372 192, 444 186"/>
      <path d="M258 256 C 340 256, 380 256, 448 256"/>
      <path d="M258 256 C 330 256, 372 320, 444 326"/>
      <path d="M258 256 C 330 256, 372 362, 430 384"/>
    </g>
    <!-- bright compression core at the transition -->
    <ellipse cx="258" cy="256" rx="60" ry="30" fill="url(#core)"/>

    <!-- Q / H flanking the transition — solid, high-contrast, readable -->
    <g font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800"
       text-anchor="middle" dominant-baseline="central"
       fill="url(#silver)" stroke="#0e1730" stroke-width="9" paint-order="stroke">
      <text x="180" y="256" font-size="150">Q</text>
      <text x="336" y="256" font-size="150">H</text>
    </g>
    <!-- faint transition dash on the core -->
    <rect x="253.5" y="238" width="9" height="36" rx="4.5" fill="#eaffff" opacity="0.7"/>
  </g>

  <circle cx="256" cy="256" r="247" fill="none" stroke="#2b3a63" stroke-width="2" opacity="0.6"/>
</svg>
