version: 2

before:
  hooks:
    - go mod tidy

# qdf-hook (the daemon/CLI) is the only GoReleaser "build": it's the only
# artifact built from Go source. qdf-hookc — the native POSIX socket client —
# is cross-compiled by `make client-all` (zig cc) in release.yml *before*
# GoReleaser runs; GoReleaser has no "prebuilt binary" builder in the OSS
# edition, so those binaries are folded in downstream via checksum/release
# extra_files instead of a fabricated build id (see below).
builds:
  - id: qdf-hook
    main: ./cmd/qdf-hook
    binary: qdf-hook
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.appVersion={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    ids: [qdf-hook]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      # Fold the matching per-arch native client into each Unix archive so
      # `brew install` gets both binaries. The glob is templated per archive;
      # Windows has no native client, so its glob matches nothing — allowed
      # because default_file_mode/anything-missing is tolerated via the
      # wildcard (see the `*` — a literal path would error when absent).
      - src: "bin/qdf-hookc-{{ .Os }}-{{ .Arch }}*"
        dst: qdf-hookc
        strip_parent: true

checksum:
  name_template: "checksums.txt"
  # Fold the zig-built native clients (produced by `make client-all` in
  # release.yml, one per linux/darwin x amd64/arm64) into the same checksum
  # manifest as the Go archives, so `signs` below covers both.
  extra_files:
    - glob: bin/qdf-hookc-*

sboms:
  - id: archive
    artifacts: archive

# Keyless cosign signing over OIDC (release.yml grants id-token: write) —
# no private key material is stored or referenced here.
signs:
  - id: checksum
    cmd: cosign
    certificate: "${certificate}"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum
    output: true

# Buildx-native multi-arch build+push (the classic dockers/docker_manifests
# pipe is deprecated and cannot attach an SBOM). One entry per image builds
# every platform into a single manifest and attaches an SBOM attestation to
# the pushed image in ghcr (buildx also adds default provenance on push).
# `provenance` is not a dockers_v2 field in GoReleaser v2.17, so SBOM is the
# explicit attestation here. Both Dockerfiles cross-compile on the native
# build platform, so no QEMU is involved.
dockers_v2:
  - id: qdf-hookd
    dockerfile: deploy/docker/daemon/Dockerfile
    platforms: [linux/amd64, linux/arm64]
    images:
      - ghcr.io/alex60217101990/qdf-hookd
    tags:
      - "{{ .Version }}"
      - latest
    build_args:
      VERSION: "{{ .Version }}"
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    sbom: true
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
  - id: qdf-hookc
    dockerfile: deploy/docker/client/Dockerfile
    platforms: [linux/amd64, linux/arm64]
    images:
      - ghcr.io/alex60217101990/qdf-hookc
    tags:
      - "{{ .Version }}"
      - latest
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    sbom: true
    extra_files:
      - client/qc.c

release:
  # Attach the zig-built native clients directly as release assets (not
  # part of any archive/build), alongside the Go archives.
  extra_files:
    - glob: bin/qdf-hookc-*

# Homebrew distribution via a cask in alex60217101990/homebrew-tap. `brews`
# (the classic formula pipe) is deprecated in GoReleaser v2, so this uses the
# cask pipe. Requires a HOMEBREW_TAP_TOKEN secret (a PAT with write access to
# the tap repo) — the release workflow's default GITHUB_TOKEN can't push to a
# second repo.
homebrew_casks:
  - name: qdf-hook
    ids: [default]
    repository:
      owner: alex60217101990
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/alex60217101990/terse"
    description: "Claude Code token-saving hooks + resident daemon"
    # qdf-hook is auto-detected and linked from the archive. The post-install
    # hook adds the matching native client, renamed from its per-arch archive
    # name to a flat `qdf-hookc`.
    hooks:
      post:
        # Install the matching native client next to qdf-hook. chmod the
        # DESTINATION (not the staged source, which the install never uses):
        # FileUtils.cp is not guaranteed to preserve mode across Ruby/FileUtils
        # versions and platforms, so set 0755 on the copy explicitly rather than
        # rely on it — otherwise qdf-hookc could land non-executable and every
        # hook would silently fall back to the CLI.
        install: |
          client = Dir["#{staged_path}/qdf-hookc/qdf-hookc-*"].first
          if client
            bin = "#{HOMEBREW_PREFIX}/bin/qdf-hookc"
            FileUtils.cp client, bin
            FileUtils.chmod 0755, bin
          end
        # Remove the copied client on uninstall (the `binary` stanza only tracks
        # qdf-hook, so this file would otherwise be orphaned).
        uninstall: |
          FileUtils.rm_f "#{HOMEBREW_PREFIX}/bin/qdf-hookc"
    caveats: |
      Wire qdf-hook into Claude Code, then restart it:
        qdf-hook init
      The resident daemon starts itself at SessionStart; upgrades replace it.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
