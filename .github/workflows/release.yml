name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Least-privilege default at the workflow level (Scorecard Token-Permissions);
# the release job elevates only the writes it needs.
permissions:
  contents: read

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release + upload assets
      packages: write # push images/manifests to ghcr.io
      id-token: write # OIDC for keyless cosign signing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: "0.16.0"

      - name: cross-build native client (produces bin/qdf-hookc-{os}-{arch})
        run: make client-all

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: "v2.6.1"

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # BuildKit from mirror.gcr.io (not Docker Hub) — no rate limit/outage.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Choose goreleaser args by trigger and configured secrets:
      #  - workflow_dispatch has no tag → --snapshot (build+validate, publish
      #    nothing) so the manual button can't fail on "git has no tag".
      #  - a real tag push publishes; but skip the Homebrew cask unless the tap
      #    PAT is configured, so a first release doesn't hard-fail on it.
      - name: decide goreleaser args
        id: gr
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          HAS_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          if [ "$IS_DISPATCH" = "true" ]; then
            echo "args=release --clean --snapshot" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_TAP" != "true" ]; then
            echo "args=release --clean --skip=homebrew" >> "$GITHUB_OUTPUT"
          else
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
          fi

      - name: goreleaser release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: ${{ steps.gr.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to alex60217101990/homebrew-tap so GoReleaser
          # can push the generated cask (the default GITHUB_TOKEN is scoped to
          # this repo only). When unset, the step above adds --skip=homebrew so
          # the release still succeeds without publishing the cask.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
