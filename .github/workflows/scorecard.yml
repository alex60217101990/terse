name: scorecard

# OpenSSF Scorecard supply-chain audit. Publishes a public score
# (https://securityscorecards.dev/viewer/) and uploads the SARIF
# report to GitHub's code-scanning UI. Weekly cadence is the
# Scorecard project's recommended default.

on:
  branch_protection_rule:
  schedule:
    - cron: "37 6 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: run scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: upload sarif to code-scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: results.sarif
