name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Saves CI minutes on PR rebases.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm gives a native arm64 lane; macos-latest is also
        # arm64 but exercises the darwin syscalls (detach, socket paths).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: test (-race, -coverprofile)
        run: go test -race -count=1 -timeout=10m -coverprofile=coverage.out -covermode=atomic ./...

      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./coverage.out
          flags: unittests-${{ matrix.os }}
          fail_ci_if_error: false

  windows-build:
    name: windows-build (compile gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: cross-build for windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          args: --timeout=5m

  client:
    name: client (zig cross-build + parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: "0.16.0"

      - name: cross-build native client (all targets)
        run: make client-all

      - name: native client parity + proxy tests
        run: go test ./internal/daemon/ -run 'TestNativeClient|TestDialAndProxy' -v

  docker:
    name: docker (multi-arch build, no push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # No setup-qemu: both Dockerfiles cross-compile on the native build
      # platform (Go GOOS/GOARCH, zig -target) and the final stage is scratch
      # with no RUN, so the arm64 image is assembled without emulation.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # Pull BuildKit from mirror.gcr.io, not Docker Hub — avoids the
          # registry-1.docker.io rate-limit/outage that flaked this job.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # provenance/sbom are off here — this job is a build gate, not a publish;
      # the release pipeline (goreleaser) attaches provenance + SBOMs. GHA cache
      # (distinct scope per image) persists BuildKit layers across runs.
      - name: build qdf-hookd (daemon) image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/daemon/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=docker-daemon
          cache-to: type=gha,mode=max,scope=docker-daemon
          build-args: |
            VERSION=ci-${{ github.sha }}

      - name: build qdf-hookc (client) image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=docker-client
          cache-to: type=gha,mode=max,scope=docker-client
